[package]
name = "cdx-notify"
version = "0.1.0"
edition = "2021"
description = "Shared notify capability for codexis-marketplace plugins: daemon e-mail + in-app bell transport, layered per-app notify settings, and the branded e-mail shell."
license = "PROPRIETARY"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Synchronous HTTP only - no tokio/async - so the per-request CGI process stays
# small and cold-start fast. The rustls feature avoids the OpenSSL build dep.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
# Foundation: daemon token/env (config, daemon_rest), atomic fs, path
# resolution, and the layered settings store NotifySettings builds on.
cdx-common = { path = "../cdx-common", default-features = false, features = ["fs", "http-client", "settings"] }

[dev-dependencies]
tempfile = "3"
# Share the home-fixture test helper instead of copy-pasting it.
cdx-common = { path = "../cdx-common", default-features = false, features = ["test-support"] }
