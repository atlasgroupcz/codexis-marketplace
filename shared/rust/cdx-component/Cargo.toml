[package]
name = "cdx-component"
version = "0.1.0"
edition = "2021"
description = "Shared building blocks for codexis-marketplace hosted-component plugins (CGI runtime, daemon notify transport, layered notify settings)."
license = "PROPRIETARY"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Synchronous HTTP only — no tokio/async — so the per-request CGI process stays
# small and cold-start fast. rustls-tls avoids the OpenSSL build dep.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
# Lower layer: daemon token/env (config, daemon_rest), atomic fs, path resolution.
cdx-common = { path = "../cdx-common", default-features = false, features = ["fs"] }

[dev-dependencies]
tempfile = "3"
