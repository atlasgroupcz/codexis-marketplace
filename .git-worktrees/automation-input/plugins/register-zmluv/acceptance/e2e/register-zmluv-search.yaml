name: register-zmluv-search
description: Verify the register-zmluv skill searches the Slovak Register of Contracts (crz.gov.sk).

# Slovak Central Register of Contracts (crz.gov.sk). Tests a broad contract search and a
# filtered follow-up; a real crz.gov.sk link in the response proves live hits.

steps:
  - prompt: "Nájdi zmluvy na údržbu ciest."
    expect:
      tool_call:
        name: shell
        input_matches: "register-zmluv search"
      tool_calls_min: 1
      tool_calls_max: 10
      response:
        # A real crz.gov.sk detail link proves search returned hits -
        # immune to "nenašiel som žiadne" false-positives.
        matches: "crz\\.gov\\.sk"

  - prompt: "A len tie uzavreté od roku 2024, prosím."
    expect:
      # Natural follow-up - may reuse step-1 chat context or re-search with --date-from.
      tool_calls_max: 8
      response:
        matches: "crz\\.gov\\.sk"
