# Single Cargo workspace over every Rust crate in the repo: the shared library
# crates (were their own workspace under shared/rust/) plus every plugin CLI.
#
# One workspace -> one Cargo.lock (consistent dependency versions across all
# plugins) and one shared target/, so `cargo build --workspace` compiles each
# dependency once instead of once per plugin. The release build.sh does exactly
# that single build, then installs each binary from target/ into its plugin's
# bin/ and components/. Local single-plugin builds still work: `cargo build -p
# <crate>`.
#
# The produced binaries are unchanged: static, self-contained, no runtime deps.
# Only the *build* is shared, not the artifacts.
[workspace]
resolver = "2"
members = [
  # shared library crates
  "shared/rust/cdx-common",
  "shared/rust/cdx-notify",
  "shared/rust/cdx-cgi",
  "shared/rust/cdx-watch",
  # plugin CLI crates
  "plugins/ares/src/ares-cli",
  "plugins/cdx-at/src/cdx-at",
  "plugins/cdx-cz-psp/src/cdx-cz-psp",
  "plugins/cdx-cz-spp/src/cdx-cz-spp",
  "plugins/cdx-nl/src/cdx-nl",
  "plugins/cdx-sk/src/cdx-sk",
  "plugins/codexis/src/cdx-cli",
  "plugins/codexis/src/cdxctl",
  "plugins/kataster-sk/src/kataster-sk-cli",
  "plugins/katastr/src/katastr",
  "plugins/leciva/src/leciva-cli",
  "plugins/nrpzs/src/nrpzs-cli",
  "plugins/obchodny-register-sk/src/orsr-cli",
  "plugins/ocr/src/ocr",
  "plugins/register-zmluv/src/register-zmluv",
  "plugins/registr-smluv/src/registr-smluv",
  "plugins/rzpro/src/rzpro-cli",
  "plugins/sbirka-listin/src/sbirka-listin",
  "plugins/video-analyze/src/video-analyze",
  "plugins/zrsr/src/zrsr-cli",
]

# Release profile for every plugin binary. Set once here (a workspace ignores
# member [profile.*] and only honours the root). `panic = "abort"` drops the
# unwinding tables for smaller binaries: safe because no crate uses catch_unwind
# and every plugin is a one-shot CLI / per-request CGI process that exits on a
# panic anyway.
[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
