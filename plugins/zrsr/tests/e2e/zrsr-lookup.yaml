name: zrsr-lookup
description: Verify the zrsr skill calls zrsr-cli against the public RPO API and relays the subject identification back to the user.

# Deterministic target: Tatra banka, a.s. - major Slovak bank, IČO 00686930,
# in RPO since 1990, current fullName is exactly "Tatra banka, a.s.".
# Seat: Hodžovo námestie 3, 811 06 Bratislava. Source register: Obchodný register.

steps:
  # 1. Lookup by IČO - verify zrsr-cli is invoked and the subject name surfaces.
  - prompt: "Čo je to za firmu IČO 00686930? Stačí mi názov a sídlo."
    expect:
      tool_call:
        name: shell
        input_matches: "zrsr-cli\\s+(detail|search|api\\s+get)\\s+.*686930"
      tool_calls_min: 1
      tool_calls_max: 8
      response:
        # "Tatra banka" is the canonical current fullName; "Hodžovo"/"Bratislav"
        # anchors the address. Both must appear (order-independent) for a real hit.
        matches: "(?s)Tatra\\s?bank.{0,200}(Hodžovo|Bratislav)|(Hodžovo|Bratislav).{0,200}Tatra\\s?bank"
      sources:
        # zrsr-cli attaches the public RPO record of each looked-up subject.
        min: 1
        matches: "api\\.statistics\\.sk/rpo/v1/entity"

  # 2. Follow-up about register + activity - natural Slovak business question.
  #    AI may answer from step-1 context (entity detail already includes
  #    sourceRegister and termination) or call again; either is fine.
  - prompt: "A je tá firma stále aktívna a v akom registri je zapísaná?"
    expect:
      tool_calls_max: 5
      response:
        # Obchodný register + active status (no termination date in RPO).
        matches: "(?i)obchodn[ýy].{0,40}registr?|aktívn|aktivn"
