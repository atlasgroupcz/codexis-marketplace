# Fresh scenario (znamky had no e2e). Structural oracle: the skill must drive
# znamky-cli (not scrape TMview/EUIPO/UPV) and surface trademark candidates.
description: znamky - trademark similarity search (TMview)

# SKIPPED in CI: znamky-cli queries the OAuth2-protected EUIPO API and reads
# EUIPO_CLIENT_ID/EUIPO_CLIENT_SECRET from .cdx/apps/znamky/.env (see
# znamky_core/settings.py). The pipeline does not provision those, so without
# them the CLI cannot get a token and the run only exercises the failure path.
# Remove `skip` once the EUIPO credentials are wired into CI (the test below is
# ready as-is). Run it locally with an explicit --config/--plugin once the
# per-app .env is in place.
skip: "needs EUIPO OAuth2 credentials (EUIPO_CLIENT_ID/SECRET in .cdx/apps/znamky/.env) that the pipeline does not provision"

prompts:
  - "{{ prompt }}"
providers:
  - id: file://../../../../tests/promptfoo/provider.py
    label: cdx-daemon
    config: {}
tests:
  - description: Trademark search calls znamky-cli and returns candidate marks
    vars:
      prompt: "Prohledej ochranné známky podobné názvu \"CODEXIS\" ve třídách 9 a 42. Krátký přehled stačí."
      tool_name: shell
      input_regex: 'znamky-cli\s+lustrace\s+text(?!.*--help)'
      tool_calls_max: 10
      forbidden_regex: '(curl|wget|requests\.get|urllib\.request|tmview|euipo\.europa\.eu|upv\.cz)'
      arbitration:
        correct:
          - "A single curl/HEAD against a URL that znamky-cli itself returned, only to confirm it resolves."
        incorrect:
          - "Using curl/wget/requests to query TMview, EUIPO or UPV directly instead of znamky-cli."
          - "Bypassing znamky-cli to scrape the trademark registers."
    assert:
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_tool_call
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_tool_count_max
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_no_tool_call
      - type: regex
        value: '[Zz]námk|[Tt]rademark|CODEXIS|[Zz]aměnitelnost|[Pp]odobn'
