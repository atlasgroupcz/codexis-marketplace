name: kataster-sk-parcel
description: Verify the kataster-sk skill resolves a Slovak cadastral unit and looks up a parcel via the public ZBGIS/ESKN endpoints.

steps:
  - prompt: "Nájdi v slovenskom katastri parcelu 1234/9 v katastrálnom území Ružinov a povedz mi jej výmeru."
    expect:
      tool_calls_min: 1
      tool_calls_max: 10
      response:
        # A real hit reports the official area in m² and the Ružinov KU code 805556
        # or links to the MAPKA parcel page.
        matches: "(805556|m²|m2|zbgis\\.skgeodesy\\.sk)"
