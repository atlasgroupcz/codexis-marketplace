[package]
name = "datify"
version = "1.0.0"
edition = "2021"
license = "PROPRIETARY"

# The shared logic (config, API client) lives in the lib so both binaries import
# it unchanged.
[lib]
name = "datify_core"
path = "src/lib.rs"

# Two binaries share the crate's logic through the lib: the system-wide CLI and
# the plugin-component CGI handler (run in place by the daemon).
[[bin]]
name = "datify-cli"
path = "src/main.rs"

[[bin]]
name = "datify-cgi"
path = "src/cgi_main.rs"

[dependencies]
serde_json = "1"
thiserror = "2"
# Synchronous HTTP client, same feature set cdxctl already uses. The blocking
# API brings a tokio runtime along - unavoidable, since reqwest is built on
# hyper - and that is the deliberate trade for `multipart`, whose Form::file
# assembles the body, escapes the filename and derives the part's media type
# from the extension (via mime_guess), so this crate keeps no hand-maintained
# extension table that would silently miss a file type.
#
# No TLS feature here: cdx-common's `reqwest-client` owns that choice for both
# crates that use reqwest, and configures the client it hands back.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "multipart", "query"] }
clap = { version = "4", features = ["derive"] }
# cdx-common: atomic fs + the KEY=VALUE credential file the settings component
# writes. cdx-cgi: the CGI runtime (query parsing, body reading, JSON emission).
cdx-common = { path = "../../../../shared/rust/cdx-common", default-features = false, features = ["reqwest-client", "fs", "env-file"] }
cdx-cgi = { path = "../../../../shared/rust/cdx-cgi" }

[features]
# Exposes `test_support` to the integration tests, which link this crate as a
# dependency and so cannot see `#[cfg(test)]` items.
test-support = []

[dev-dependencies]
# This crate, with its stub server switched on - the integration tests in tests/
# reach it the same way any consumer would.
datify = { path = ".", features = ["test-support"] }
tempfile = "3"
# The shared HomeGuard test helper (redirects $HOME to a scratch dir) instead of
# a copy-pasted per-crate one.
cdx-common = { path = "../../../../shared/rust/cdx-common", default-features = false, features = ["reqwest-client", "test-support"] }
