[package]
name = "rzpro-cli"
version = "1.0.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
csv = "1"
# Statically link OpenSSL so the binary runs regardless of the host's libssl.
# Required because the KSRZIS server rejects rustls handshakes (native-tls only).
openssl = { version = "0.10", features = ["vendored"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
