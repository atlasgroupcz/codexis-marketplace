name: nrpzs-lookup
description: Verify the nrpzs skill calls nrpzs-cli against the public NRPZS API and relays provider info back to the user.

# Deterministic target: Oblastní nemocnice Příbram, a.s. — IČO 27085031,
# Středočeský kraj. Public provider with a stable record in NRPZS.

steps:
  - prompt: "Najdi v registru poskytovatelů zdravotních služeb firmu s IČO 27085031. Stačí název a kraj."
    expect:
      tool_call:
        name: shell
        input_matches: "nrpzs-cli\\s+(search|profil|api\\s+get)\\s+.*27085031"
      tool_calls_min: 1
      tool_calls_max: 8
      response:
        matches: "(?s)P[řr]íbram.{0,200}St[řr]edo[čc]esk|St[řr]edo[čc]esk.{0,200}P[řr]íbram"

  - prompt: "Které urologické ambulance jsou ve Středočeském kraji?"
    expect:
      tool_call:
        name: shell
        input_matches: "nrpzs-cli\\s+search\\s+.*--obor\\s+\\S+.*--kraj"
      tool_calls_max: 5
      response:
        matches: "(?i)urolog"
