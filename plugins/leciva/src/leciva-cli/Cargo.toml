[package]
name = "leciva-cli"
version = "1.4.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
cdx-common = { path = "../../../../shared/rust/cdx-common", features = ["curl", "search", "search-engine"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
