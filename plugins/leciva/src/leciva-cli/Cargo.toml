[package]
name = "leciva-cli"
version = "1.3.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"

[profile.release]
strip = true
lto = true
codegen-units = 1
