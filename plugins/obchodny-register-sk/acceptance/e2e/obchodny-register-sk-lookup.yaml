name: obchodny-register-sk-lookup
description: Verify the obchodny-register-sk skill looks up a Slovak company in the RPO open API (ESET - stable, well-known entity).

steps:
  - prompt: "Nájdi v slovenskom obchodnom registri firmu ESET, spol. s r.o. - kto sú konatelia a aké má základné imanie?"
    expect:
      tool_calls_min: 1
      tool_calls_max: 10
      response:
        # A real RPO hit reports the IČO 31333532 (possibly digit-grouped) or the
        # registration number Sro 3586/B (slash or "vložka č." phrasing) or links
        # to the orsr.sk extract (possibly rendered as a citation span).
        matches: "(31\\s?333\\s?532|Sro\\D{0,15}3586/B|orsr\\.sk|data-cdx-citation-id)"

  - prompt: "Vyhľadaj v RPO subjekt podľa IČO 31333532 a uveď jeho RPO ID."
    expect:
      tool_call:
        name: shell
        input_matches: "orsr-cli\\s+(--no-cache\\s+)?search\\s+.*31333532"
      tool_calls_min: 1
      tool_calls_max: 8
      response:
        matches: "(?s)937053.{0,240}ESET|ESET.{0,240}937053"

  - prompt: "U detailu RPO ID 937053 zisti zdrojový register a registračné číslo."
    expect:
      tool_call:
        name: shell
        input_matches: "orsr-cli\\s+(--no-cache\\s+)?detail\\s+937053"
      tool_calls_min: 1
      tool_calls_max: 8
      response:
        matches: "(?s)Obchodn(ý|y|í) register.{0,240}Sro/3586/B|Sro/3586/B.{0,240}Obchodn(ý|y|í) register"

  - prompt: "Daj mi odkaz na aktuálny výpis z obchodného registra pre IČO 31333532."
    expect:
      tool_call:
        name: shell
        input_matches: "orsr-cli\\s+(--no-cache\\s+)?links\\s+.*31333532"
      tool_calls_min: 1
      tool_calls_max: 8
      response:
        matches: "orsr\\.sk/vypis\\.asp"
      sources:
        # orsr-cli links attaches the orsr.sk aktuálny výpis of each subject.
        min: 1
        matches: "orsr\\.sk/vypis\\.asp"
