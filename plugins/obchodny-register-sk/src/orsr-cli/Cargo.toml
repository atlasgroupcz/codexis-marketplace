[package]
name = "orsr-cli"
version = "0.2.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
cdx-common = { path = "../../../../shared/rust/cdx-common", features = ["ico"] }

