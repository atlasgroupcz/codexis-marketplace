mutation SaveSkill($id: ID, $input: SkillInput!) {
    saveSkill(id: $id, input: $input) {
        skill {
            id
            name
            fullName
            description
            allowedTools
            sourceKind
            editable
            deletable
            displayName
            summary
            path { absolutePath displayPath }
            sourcePath { absolutePath displayPath }
        }
        errors { field message allowedValues }
    }
}
