query GetAgents {
    agents {
        id
        name
        fullName
        description
        plugin { id name marketplace { id name } }
        tools { toolName displayName kind source }
        skills
        jurisdictions
        model
        maxTurns
        instructions
        disallowedTools { toolName displayName kind source }
        sourceKind
        editable
        deletable
        path { absolutePath displayPath }
        sourcePath { absolutePath displayPath }
    }
}
