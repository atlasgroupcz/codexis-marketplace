mutation SaveAutomation($id: ID, $input: AutomationInput!) {
    saveAutomation(id: $id, input: $input) {
        automation {
            id
            type
            command
            title
            description
            agent { id fullName }
            skills { id fullName }
            schedule { repeat dayPart daysOfWeek dayOfMonth }
            prompt
            enabled
            maxTurns
            model
            modelConfiguration { key value }
            jurisdictions
            project { id name }
            connections { id name }
        }
        errors { field message allowedValues }
    }
}
