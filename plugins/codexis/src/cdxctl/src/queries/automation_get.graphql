query GetAutomations {
    automations {
        id
        type
        command
        title
        description
        agent { id fullName }
        skills { id fullName }
        schedule { repeat dayPart daysOfWeek dayOfMonth }
        prompt
        enabled
        maxTurns
        model
        modelConfiguration { key value }
        jurisdictions
        lastRun {
            id
            status
            startedAt
            finishedAt
            trigger
            errorMessage
        }
    }
}
