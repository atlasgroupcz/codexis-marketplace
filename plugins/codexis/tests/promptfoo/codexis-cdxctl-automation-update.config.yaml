description: codexis cdxctl - automation partial update
target_plugin: codexis

prompts:
  - "{{ prompt }}"

providers:
  - id: file://../../../../tests/promptfoo/provider.py
    label: cdx-daemon
    config: {}

tests:
  - description: automation create-command (initial state for the update sequence)
    vars:
      prompt: "Vytvoř automatizaci e2e-upd-{{ run_id }}, která první den každého měsíce v noci spustí 'echo initial'."
      tool_name: shell
      input_regex: 'automation\s+create-command'
      tool_calls_min: 1
      tool_calls_max: 12
      forbidden_regex: '(curl|wget|requests\.get|urllib\.request|http://localhost:8086)'
      # Arbitration criteria (read only by `run.py --arbitrate` when a
      # deterministic check above fails): legitimate vs illegitimate behavior.
      arbitration:
        correct:
          - "Performing the requested registry operation through the cdxctl CLI (agent/skill/automation/notification/marketplace/plugin/tabular subcommands), including reading or writing the local files the workflow needs."
        incorrect:
          - "Bypassing cdxctl to call the daemon API directly via curl/wget/requests to http://localhost:8086."
          - "Creating, updating or deleting daemon state by any route other than cdxctl."
      graphql: "{ automations { title schedule { repeat dayPart dayOfMonth } command enabled } }"
      jsonpath: "$.automations[?(@.title == 'e2e-upd-{{ run_id }}')]"
      count: 1
      subset:
        schedule:
          repeat: "MONTHLY"
          dayPart: "NIGHT"
          dayOfMonth: 1
        command: "echo initial"
        enabled: true
    assert:
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_tool_call
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_tool_count_min
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_tool_count_max
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_no_tool_call
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_state_graphql

  - description: automation update - rename + change schedule, command preserved
    vars:
      prompt: "U automatizace e2e-upd-{{ run_id }} změň název na e2e-upd-{{ run_id }}-v2 a plán na druhý den každého měsíce v noci."
      tool_name: shell
      input_regex: 'automation\s+update'
      tool_calls_min: 1
      tool_calls_max: 12
      forbidden_regex: '(curl|wget|requests\.get|urllib\.request|http://localhost:8086)'
      # Arbitration criteria (read only by `run.py --arbitrate` when a
      # deterministic check above fails): legitimate vs illegitimate behavior.
      arbitration:
        correct:
          - "Performing the requested registry operation through the cdxctl CLI (agent/skill/automation/notification/marketplace/plugin/tabular subcommands), including reading or writing the local files the workflow needs."
        incorrect:
          - "Bypassing cdxctl to call the daemon API directly via curl/wget/requests to http://localhost:8086."
          - "Creating, updating or deleting daemon state by any route other than cdxctl."
      graphql: "{ automations { title schedule { repeat dayPart dayOfMonth } command enabled } }"
      jsonpath: "$.automations[?(@.title == 'e2e-upd-{{ run_id }}-v2')]"
      count: 1
      subset:
        schedule:
          repeat: "MONTHLY"
          dayPart: "NIGHT"
          dayOfMonth: 2
        command: "echo initial"
        enabled: true
    assert:
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_tool_call
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_tool_count_min
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_tool_count_max
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_no_tool_call
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_state_graphql

  - description: automation update - disable enabled flag
    vars:
      prompt: "Automatizaci e2e-upd-{{ run_id }}-v2 vypni."
      tool_name: shell
      input_regex: 'automation\s+update.{0,500}enabled'
      tool_calls_min: 1
      tool_calls_max: 12
      forbidden_regex: '(curl|wget|requests\.get|urllib\.request|http://localhost:8086)'
      # Arbitration criteria (read only by `run.py --arbitrate` when a
      # deterministic check above fails): legitimate vs illegitimate behavior.
      arbitration:
        correct:
          - "Performing the requested registry operation through the cdxctl CLI (agent/skill/automation/notification/marketplace/plugin/tabular subcommands), including reading or writing the local files the workflow needs."
        incorrect:
          - "Bypassing cdxctl to call the daemon API directly via curl/wget/requests to http://localhost:8086."
          - "Creating, updating or deleting daemon state by any route other than cdxctl."
      graphql: "{ automations { title enabled } }"
      jsonpath: "$.automations[?(@.title == 'e2e-upd-{{ run_id }}-v2')].enabled"
      equals: false
    assert:
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_tool_call
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_tool_count_min
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_tool_count_max
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_no_tool_call
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_state_graphql

  - description: automation delete - final cleanup
    vars:
      prompt: "Smaž automatizaci e2e-upd-{{ run_id }}-v2."
      tool_name: shell
      input_regex: 'automation\s+delete'
      tool_calls_min: 1
      tool_calls_max: 12
      forbidden_regex: '(curl|wget|requests\.get|urllib\.request|http://localhost:8086)'
      # Arbitration criteria (read only by `run.py --arbitrate` when a
      # deterministic check above fails): legitimate vs illegitimate behavior.
      arbitration:
        correct:
          - "Performing the requested registry operation through the cdxctl CLI (agent/skill/automation/notification/marketplace/plugin/tabular subcommands), including reading or writing the local files the workflow needs."
        incorrect:
          - "Bypassing cdxctl to call the daemon API directly via curl/wget/requests to http://localhost:8086."
          - "Creating, updating or deleting daemon state by any route other than cdxctl."
      graphql: "{ automations { title } }"
      jsonpath: "$.automations[*].title"
      not_contains: "e2e-upd-{{ run_id }}-v2"
    assert:
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_tool_call
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_tool_count_min
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_tool_count_max
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_no_tool_call
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_state_graphql
