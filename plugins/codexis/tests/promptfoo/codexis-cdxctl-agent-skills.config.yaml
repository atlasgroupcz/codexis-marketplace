# Verifies flag-based `cdxctl agent create` attaches a fitting legal skill for a
# contract/HR agent - contract review is legal work, so the model should give it
# the legal-research skill (codexis) on top of any document skill, and go through
# cdxctl rather than the daemon API. Which skill fits is the model's call, guided
# by each skill's description in `cdxctl skill list`, so this is an acceptance
# check (not a unit test). Jurisdiction is not set per-test by the harness; the
# Czech-law framing of the prompt steers the model to the Czech legal skill.

description: codexis cdxctl - agent create attaches a fitting legal skill
target_plugin: codexis

prompts:
  - "{{ prompt }}"

providers:
  - id: file://../../../../tests/promptfoo/provider.py
    label: cdx-daemon
    config: {}

tests:
  - description: HR contract agent gets the legal-research skill via flag-based create
    vars:
      prompt: |
        Vytvoř mi vlastního agenta jménem ee-hr-{{ run_id }}, který připravuje a
        kontroluje pracovní smlouvy nových zaměstnanců podle českého zákoníku práce.
        Vyber mu sám vhodné dovednosti a založ ho.
      tool_name: shell
      input_regex: 'agent\s+create[\s\S]{0,400}--skill'
      tool_calls_min: 1
      tool_calls_max: 16
      forbidden_regex: '(curl|wget|requests\.get|urllib\.request|http://localhost:8086)'
      # Arbitration criteria (read only by `run.py --arbitrate` when a
      # deterministic check above fails): legitimate vs illegitimate behavior.
      arbitration:
        correct:
          - "Creating the agent through cdxctl and attaching the legal-research skill (codexis) because contract review is legal work; a document skill (docx) may also be attached."
        incorrect:
          - "Bypassing cdxctl to call the daemon API directly via curl/wget/requests to http://localhost:8086."
          - "Creating the agent with no skill, or only a document skill, ignoring that contract review is legal work."
      graphql: "{ agents { name skills } }"
      jsonpath: "$.agents[?(@.name == 'ee-hr-{{ run_id }}')].skills[*]"
      contains: "codexis"
    assert:
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_tool_call
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_tool_count_min
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_tool_count_max
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_no_tool_call
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_state_graphql

  - description: cleanup - delete the test agent
    vars:
      prompt: "Smaž agenta ee-hr-{{ run_id }}."
      tool_name: shell
      input_regex: 'agent\s+delete'
      tool_calls_min: 1
      tool_calls_max: 12
      forbidden_regex: '(curl|wget|requests\.get|urllib\.request|http://localhost:8086)'
      arbitration:
        correct:
          - "Deleting the agent through cdxctl."
        incorrect:
          - "Bypassing cdxctl to call the daemon API directly."
      graphql: "{ agents { name } }"
      jsonpath: "$.agents[*].name"
      not_contains: "ee-hr-{{ run_id }}"
    assert:
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_tool_call
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_tool_count_min
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_tool_count_max
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_no_tool_call
      - type: python
        value: file://../../../../tests/promptfoo/assertions.py:assert_state_graphql
