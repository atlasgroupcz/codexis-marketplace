name: cdxctl-agent-flags
description: >
  Verify cdxctl builds an agent from field flags instead of markdown, keeps the
  untouched fields on update, and reports a rejected field with its allowed values.

steps:
  - prompt: |
      Vytvoř mi agenta jménem ee-flags-{{ run_id }}, který posuzuje zákonnost výpovědi.
      Má umět shell, běžet na modelu CLAUDE_OPUS_4_8 a mít limit 7 tahů.
    expect:
      tool_call:
        name: shell
        # The flags replace the markdown loop entirely - a --stdin here is a bug.
        input_matches: "agent create.{0,400}--name"
      tool_calls_min: 1
      tool_calls_max: 6
      state:
        graphql: "{ agents { name model maxTurns editable } }"
        jsonpath: "$.agents[?(@.name == 'ee-flags-{{ run_id }}')]"
        count: 1
        matches_subset:
          model: "claude-opus-4-8"
          maxTurns: 7
          editable: true

  - prompt: "U agenta ee-flags-{{ run_id }} změň jen popis na 'E2E flags - updated'."
    expect:
      tool_call:
        name: shell
        input_matches: "agent update.{0,400}--description"
      tool_calls_min: 1
      tool_calls_max: 6
      state:
        graphql: "{ agents { name description model maxTurns } }"
        jsonpath: "$.agents[?(@.name == 'ee-flags-{{ run_id }}')]"
        count: 1
        # AgentInput is a full replace, so a single --description must not wipe
        # the model or the turn budget.
        matches_subset:
          description: "E2E flags - updated"
          model: "claude-opus-4-8"
          maxTurns: 7

  - prompt: "Přidej agentovi ee-flags-{{ run_id }} skill jménem rozhodne-neexistuje."
    expect:
      tool_calls_min: 1
      tool_calls_max: 6
      response:
        contains: "rozhodne-neexistuje"
      state:
        graphql: "{ agents { name skills } }"
        jsonpath: "$.agents[?(@.name == 'ee-flags-{{ run_id }}')].skills"
        not_contains: "rozhodne-neexistuje"

  - prompt: "Smaž agenta ee-flags-{{ run_id }}."
    expect:
      tool_call:
        name: shell
        input_matches: "agent delete"
      tool_calls_min: 1
      tool_calls_max: 6
      state:
        graphql: "{ agents { name } }"
        jsonpath: "$.agents[*].name"
        not_contains: "ee-flags-{{ run_id }}"
