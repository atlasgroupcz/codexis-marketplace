name: sid-search
description: Verify the sid skill drives sid-cli for internal document lookups and relays real SID data back to the user.

# Needs `--var sid_api_key=…`, and a SID instance that accepts API keys.
# Neither exists yet: headless auth is still an unmerged SID branch, so
# onprem answers /api/v1/* with a 307 to /login. Remove this `skip` once SID
# is deployed and CI has a key to pass — the steps below are ready as they
# are. Skipping is deliberate: without a key the run would only ever exercise
# the "no key" path and would pass whether SID works or not.
skip: "waiting for SID headless auth to be deployed and a CI key to be provisioned"

# The key lands in the per-app env file the CLI reads (config.ts loads
# SID_API_KEY= from $CODEXIS_PUBLIC_USER_HOME/.cdx/apps/sid/.env), the same
# way the katastr plugin does it. `sid_api_base` lets CI point at a staging
# SID; otherwise CODEXIS_PLUGIN_SID_API_URL from plugin.json applies.

setup:
  - upload:
      destination: /home/codexis/.cdx/apps/sid
      files:
        - path: .env
          content: "SID_API_KEY={{ sid_api_key }}\nSID_API_URL={{ sid_api_base }}\n"

steps:
  # 1. The key must actually authenticate — `settings test` returns the signed-in
  #    user, which proves the whole chain (env file → x-api-key → SID) works.
  #    A broken key surfaces here instead of hiding behind an empty result set.
  - prompt: "Ověř, že mám funkční připojení do SID a řekni mi, pod jakým účtem jsem přihlášený."
    expect:
      tool_call:
        name: shell
        input_matches: "sid-cli\\s+settings\\s+test"
      tool_calls_min: 1
      tool_calls_max: 5
      response:
        # The e-mail of the authenticated account proves a real 200 from SID.
        matches: "@"

  # 2. Search must reach for sid-cli, never curl.
  - prompt: "Najdi mi v SID interní směrnice o bezpečnosti práce."
    expect:
      tool_call:
        name: shell
        input_matches: "sid-cli\\s+(search|docs\\s+list)\\s+"
      tool_calls_min: 1
      tool_calls_max: 8
      response:
        # Either hits were relayed, or the model correctly reported an empty
        # result / fulltext outage — but never a raw error or a curl fallback.
        matches: "(?is)(směrnic|dokument|nenalez|nedostupn)"

  # 3. Personal query — a different subcommand of the same tool.
  - prompt: "Co mám v SID potvrdit?"
    expect:
      tool_call:
        name: shell
        input_matches: "sid-cli\\s+confirmations\\s+list"
      tool_calls_max: 5
      response:
        matches: "(?is)(potvr|nic|žádn)"
