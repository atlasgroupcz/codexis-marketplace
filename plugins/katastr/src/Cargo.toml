[workspace]
resolver = "2"
members = [
    "katastr-core",
    "katastr-cgi",
    "katastr-cli",
]

[workspace.package]
edition = "2021"
license = "PROPRIETARY"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
# Synchronous HTTP client - no tokio/async runtime pulled in, keeps the CGI
# binary small and cold-start fast. rustls-tls avoids the OpenSSL build dep.
# Used for BOTH the ČÚZK REST calls and the daemon notify transport (e-mail +
# in-app), so we never link reqwest/tokio into the per-request CGI process.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
clap = { version = "4", features = ["derive"] }
# Shared marketplace capability crates. `cdx-common` gives the std-only building
# blocks (daemon token auth, host env config, atomic fs, the per-item store), so
# default features (which pull serde_json for the `sources` module) stay off and
# each crate opts into what it needs. The watcher domain (`cdx-watch`), notify
# transport + settings (`cdx-notify`) and the CGI runtime (`cdx-cgi`) are the
# same crates every other hosted-component plugin consumes.
cdx-common = { path = "../../../shared/rust/cdx-common", default-features = false }
cdx-watch = { path = "../../../shared/rust/cdx-watch" }
cdx-notify = { path = "../../../shared/rust/cdx-notify" }
cdx-cgi = { path = "../../../shared/rust/cdx-cgi" }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
