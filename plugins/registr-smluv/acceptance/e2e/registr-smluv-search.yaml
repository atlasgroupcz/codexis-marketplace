name: registr-smluv-search
description: Verify the registr-smluv skill searches the Czech Register of Contracts (smlouvy.gov.cz).

# Czech Register of Contracts (smlouvy.gov.cz). Tests a broad contract search and a
# filtered follow-up; a real smlouvy.gov.cz link in the response proves live hits.

steps:
  - prompt: "Najdi smlouvy o rekonstrukci silnic."
    expect:
      tool_call:
        name: shell
        input_matches: "registr-smluv search"
      tool_calls_min: 1
      tool_calls_max: 10
      response:
        # A real smlouvy.gov.cz detail link proves search returned hits —
        # immune to "nenašel jsem žádné" false-positives.
        matches: "smlouvy\\.gov\\.cz"

  - prompt: "A jen ty aktuálně platné, prosím."
    expect:
      # Natural follow-up — may reuse step-1 chat context or re-search with --only-valid.
      tool_calls_max: 8
      response:
        matches: "smlouvy\\.gov\\.cz"
